<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Pattern Suite — 15 Pattern Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo">Star Pattern Suite</div>
    <p class="tagline">Pick a pattern, drag the slider, watch it render.</p>
  </div>
</header>
<main class="wrap">
  <section class="controls">
    <div class="control-group">
      <label for="patternSelect">Pattern</label>
      <select id="patternSelect"></select>
    </div>
    <div class="control-group">
      <label for="sizeRange">Grid size (N = <span id="sizeValue">7</span>)</label>
      <input type="range" id="sizeRange" min="2" max="15" value="7" step="1">
    </div>
    <div class="control-group">
      <label for="charInput">Character</label>
      <input type="text" id="charInput" maxlength="1" value="*">
    </div>
    <div class="control-group invert-group" id="invertGroup" hidden>
      <label for="invertCheck">Variant</label>
      <label class="invert-toggle">
        <input type="checkbox" id="invertCheck">
        <span id="invertLabel">Invert</span>
      </label>
    </div>
  </section>
  <section class="output-section">
    <div class="output-header">
      <h2 id="patternTitle">Pattern</h2>
      <p id="patternDesc"></p>
    </div>
    <div class="stage">
      <div id="grid" class="grid"></div>
    </div>
    <details class="code-view">
      <summary>View as text</summary>
      <pre id="textOutput"></pre>
    </details>
  </section>
</main>
<footer>
  <div class="wrap">
    <span>15 patterns · adjustable grid · live render</span>
  </div>
</footer>
<script src="script.js"></script>
</body>
</html>
